# The reverse proxy the staging box runs, at /opt/gnl/nginx.conf.
# cloud-init writes it on first boot; `just azure sync` replaces it afterwards.
#
# The frontend repo commits VITE_BACKEND_URL=/api, so the browser calls the SAME origin
# under /api. The rewrite strips that prefix, because backend routes carry none.
# conf.d files load inside the http block, so log_format is allowed here.
# rt = whole request, up = time the backend or frontend took to answer.
log_format timed '$remote_addr [$time_local] "$request" $status $body_bytes_sent rt=$request_time up=$upstream_response_time';

server {
    listen 80;
    server_name _;
    access_log /dev/stdout timed;

    # Docker's embedded DNS. Naming upstreams in a variable defers lookup to request time,
    # so nginx starts even when a container is absent and answers 502 instead of
    # crash-looping on "host not found in upstream".
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $upstream_backend backend:5002;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The shell must be fetched fresh on every load so a new image shows at once; hashed assets stay cacheable.
    location = /index.html {
        set $upstream_frontend frontend:5003;
        proxy_pass http://$upstream_frontend;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache";
    }

    location = / {
        set $upstream_frontend frontend:5003;
        proxy_pass http://$upstream_frontend;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache";
    }

    location / {
        set $upstream_frontend frontend:5003;
        proxy_pass http://$upstream_frontend;
        proxy_set_header Host $host;
    }
}

# The staging stack: the prod shape, one VM, two containers.
services:
  db:
    image: mysql:5.7.41
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: gnl
    volumes:
      - dbdata:/var/lib/mysql
    # Loopback only; reach it through an SSH tunnel
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    image: gnl-backend:staging
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@db:3306/gnl
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
    ports:
      - "5002:5002"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  dbdata:
